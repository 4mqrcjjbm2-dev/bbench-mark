# SearXNG pour Jarvis : moteur de recherche libre, privé, auto-hébergé.
use_default_settings: true
general:
  instance_name: "Jarvis"
server:
  secret_key: "remplace-par-SEARXNG_SECRET"  # remplacé par la variable SEARXNG_SECRET
  limiter: false          # accès seulement depuis Jarvis, sur le réseau Docker
  image_proxy: false
search:
  safe_search: 0
  default_lang: "fr"
  formats:
    - html
    - json                # nécessaire pour que Jarvis lise les résultats
